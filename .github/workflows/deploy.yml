name: Deploy EnB Droplist to soulbound.se

on:
  push:
    branches: [main]
    paths:
      - 'release/EnB Droplist.zip'
      - 'release/version.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: enb-droplist-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FTP client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload release files to Simply.com
        shell: bash
        env:
          FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
          FTP_PASS: ${{ secrets.SIMPLY_FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" ftp.simply.com <<'LFTP'
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ssl:verify-certificate yes
          mkdir -p /public_html/EnB/Download
          cd /public_html/EnB/Download
          put "release/EnB Droplist.zip" -o "EnB Droplist.zip"
          put "release/version.json" -o "version.json"
          bye
          LFTP

      - name: Verify uploaded files via FTP
        shell: bash
        env:
          FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
          FTP_PASS: ${{ secrets.SIMPLY_FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" ftp.simply.com <<'LFTP'
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ssl:verify-certificate yes
          cd /public_html/EnB/Download
          cls -l "EnB Droplist.zip"
          cls -l "version.json"
          bye
          LFTP

      - name: Public URL check (informational)
        continue-on-error: true
        shell: bash
        run: |
          echo "Checking public URLs. Simply.com may block GitHub runners with HTTP 455."
          curl -A 'Mozilla/5.0' --silent --show-error --location \
            --max-time 20 \
            https://soulbound.se/EnB/Download/version.json || true
          curl -A 'Mozilla/5.0' --silent --show-error --location \
            --range 0-0 --max-time 20 \
            'https://soulbound.se/EnB/Download/EnB%20Droplist.zip' -o /dev/null || true
