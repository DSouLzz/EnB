name: Deploy EnB Droplist to soulbound.se

on:
  push:
    branches: [main]
    paths:
      - 'release/EnB Droplist.zip'
      - 'release/version.json'
      - '.github/scripts/build_1134.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enb-droplist-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build EnB Droplist 1.1.34 when needed
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/build_1134.py
          if ! git diff --quiet -- "release/EnB Droplist.zip" release/version.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "release/EnB Droplist.zip" release/version.json
            git commit -m "Release EnB Droplist 1.1.34 built and verified"
            git push
          else
            echo "Release already at 1.1.34; nothing to commit."
          fi

      - name: Verify release manifest matches ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          zp = pathlib.Path('release/EnB Droplist.zip')
          manifest = json.loads(pathlib.Path('release/version.json').read_text(encoding='utf-8'))
          actual = hashlib.sha256(zp.read_bytes()).hexdigest()
          expected = str(manifest.get('sha256','')).lower()
          print('version:', manifest.get('version'))
          print('sha256 :', actual)
          if manifest.get('version') != '1.1.34':
              raise SystemExit(f"Wrong release version: {manifest.get('version')}")
          if actual != expected:
              raise SystemExit(f'SHA mismatch: manifest={expected} actual={actual}')
          with zipfile.ZipFile(zp) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'ZIP integrity failed at {bad}')
          print('release verification: OK')
          PY

      - name: Install FTP client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload release files to Simply.com
        shell: bash
        env:
          FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
          FTP_PASS: ${{ secrets.SIMPLY_FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" ftp.simply.com <<'LFTP'
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ssl:verify-certificate yes
          mkdir -p /public_html/EnB/Download
          cd /public_html/EnB/Download
          put "release/EnB Droplist.zip" -o "EnB Droplist.zip"
          put "release/version.json" -o "version.json"
          bye
          LFTP

      - name: Verify uploaded files via FTP
        shell: bash
        env:
          FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
          FTP_PASS: ${{ secrets.SIMPLY_FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" ftp.simply.com <<'LFTP'
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ssl:verify-certificate yes
          cd /public_html/EnB/Download
          cls -l "EnB Droplist.zip"
          cls -l "version.json"
          bye
          LFTP

      - name: Public URL check (informational)
        continue-on-error: true
        shell: bash
        run: |
          curl -A 'Mozilla/5.0' --silent --show-error --location --max-time 20 https://soulbound.se/EnB/Download/version.json || true
