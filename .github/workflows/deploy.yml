name: Deploy EnB Droplist to soulbound.se

on:
  push:
    branches: [main]
    paths:
      - 'release/EnB Droplist.zip'
      - 'release/version.json'
      - 'release130/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enb-droplist-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble staged 1.1.30 release when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f release130/part00.b64 ]; then
            echo "Found staged 1.1.30 release; assembling exact binary ZIP."
            test -f release130/part01.b64
            test -f release130/part02.b64
            test -f release130/part03.b64
            test -f release130/part04.b64
            cat release130/part00.b64 release130/part01.b64 release130/part02.b64 release130/part03.b64 release130/part04.b64 > /tmp/enb130.b64
            base64 --decode /tmp/enb130.b64 > "release/EnB Droplist.zip"
            echo "934a65fc8f6ddc248237256b5975c1f1635af0945494b90714a33ceae9c7377e  release/EnB Droplist.zip" | sha256sum -c -
            test "$(stat -c%s 'release/EnB Droplist.zip')" = "45016"
            python - <<'PY'
          import json, zipfile
          path = 'release/EnB Droplist.zip'
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'ZIP integrity failed at {bad}')
          d = {
              'name': 'EnB Droplist',
              'version': '1.1.30',
              'download_url': 'https://soulbound.se/EnB/Download/EnB%20Droplist.zip',
              'sha256': '934a65fc8f6ddc248237256b5975c1f1635af0945494b90714a33ceae9c7377e',
              'release_date': '2026-08-23',
              'release_notes': 'Fixes online updater and Check/Repair. Updates now fall back to the GitHub release when soulbound.se fails or has the wrong SHA. Check/Repair is fully automatic and does not ask the user to locate a folder or ZIP.'
          }
          with open('release/version.json', 'w', encoding='utf-8') as f:
              json.dump(d, f, indent=2)
              f.write('\n')
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "release/EnB Droplist.zip" release/version.json
            git rm -r release130
            git commit -m "Release EnB Droplist 1.1.30 assembled and verified"
            git push
          else
            echo "No staged release parts; deploying current release files."
          fi

      - name: Verify release manifest matches ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          zp = pathlib.Path('release/EnB Droplist.zip')
          manifest = json.loads(pathlib.Path('release/version.json').read_text(encoding='utf-8'))
          actual = hashlib.sha256(zp.read_bytes()).hexdigest()
          expected = str(manifest.get('sha256','')).lower()
          print('version:', manifest.get('version'))
          print('sha256 :', actual)
          if actual != expected:
              raise SystemExit(f'SHA mismatch: manifest={expected} actual={actual}')
          with zipfile.ZipFile(zp) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'ZIP integrity failed at {bad}')
          print('release verification: OK')
          PY

      - name: Install FTP client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload release files to Simply.com
        shell: bash
        env:
          FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
          FTP_PASS: ${{ secrets.SIMPLY_FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" ftp.simply.com <<'LFTP'
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ssl:verify-certificate yes
          mkdir -p /public_html/EnB/Download
          cd /public_html/EnB/Download
          put "release/EnB Droplist.zip" -o "EnB Droplist.zip"
          put "release/version.json" -o "version.json"
          bye
          LFTP

      - name: Verify uploaded files via FTP
        shell: bash
        env:
          FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
          FTP_PASS: ${{ secrets.SIMPLY_FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" ftp.simply.com <<'LFTP'
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ssl:verify-certificate yes
          cd /public_html/EnB/Download
          cls -l "EnB Droplist.zip"
          cls -l "version.json"
          bye
          LFTP

      - name: Public URL check (informational)
        continue-on-error: true
        shell: bash
        run: |
          echo "Checking public URLs. Simply.com may block GitHub runners with HTTP 455."
          curl -A 'Mozilla/5.0' --silent --show-error --location \
            --max-time 20 \
            https://soulbound.se/EnB/Download/version.json || true
          curl -A 'Mozilla/5.0' --silent --show-error --location \
            --range 0-0 --max-time 20 \
            'https://soulbound.se/EnB/Download/EnB%20Droplist.zip' -o /dev/null || true
