name: Deploy EnB Droplist to soulbound.se

on:
  push:
    branches: [main]
    paths:
      - 'release/EnB Droplist.zip'
      - 'release/version.json'
      - 'release131/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble staged 1.1.31 release when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f release131/part00.b64 ]; then
            echo "Found staged 1.1.31 release; assembling exact binary ZIP."
            for n in 00 01 02 03 04 05 06; do test -f "release131/part${n}.b64"; done
            cat release131/part00.b64 release131/part01.b64 release131/part02.b64 release131/part03.b64 release131/part04.b64 release131/part05.b64 release131/part06.b64 > /tmp/enb131.b64
            base64 --decode /tmp/enb131.b64 > "release/EnB Droplist.zip"
            echo "84c51f625bf75bc13ab67a4b9242482f46446f2de97c2d64bdb3384a98cf6e41  release/EnB Droplist.zip" | sha256sum -c -
            test "$(stat -c%s 'release/EnB Droplist.zip')" = "45194"
            python - <<'PY'
          import json, zipfile
          path = 'release/EnB Droplist.zip'
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'ZIP integrity failed at {bad}')
          d = {
              'name': 'EnB Droplist',
              'version': '1.1.31',
              'download_url': 'https://soulbound.se/EnB/Download/EnB%20Droplist.zip',
              'sha256': '84c51f625bf75bc13ab67a4b9242482f46446f2de97c2d64bdb3384a98cf6e41',
              'release_date': '2026-08-23',
              'release_notes': 'OCR reliability update: enemies require an explicit Level row in the target card, target OCR scans the corrected higher target-card header, and F8 prefers the last confirmed live zone instead of raw OCR noise.'
          }
          with open('release/version.json', 'w', encoding='utf-8') as f:
              json.dump(d, f, indent=2)
              f.write('\n')
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "release/EnB Droplist.zip" release/version.json
            git rm -r release131
            git commit -m "Release EnB Droplist 1.1.31 assembled and verified"
            git push
          else
            echo "No staged 1.1.31 parts; deploying current release files."
          fi

      - name: Verify release manifest matches ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          zp = pathlib.Path('release/EnB Droplist.zip')
          manifest = json.loads(pathlib.Path('release/version.json').read_text(encoding='utf-8'))
          actual = hashlib.sha256(zp.read_bytes()).hexdigest()
          expected = str(manifest.get('sha256','')).lower()
          print('version:', manifest.get('version'))
          print('sha256 :', actual)
          if actual != expected:
              raise SystemExit(f'SHA mismatch: manifest={expected} actual={actual}')
          with zipfile.ZipFile(zp) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'ZIP integrity failed at {bad}')
          print('release verification: OK')
          PY

      - name: Install FTP client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload release files to Simply.com
        shell: bash
        env:
          FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
          FTP_PASS: ${{ secrets.SIMPLY_FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" ftp.simply.com <<'LFTP'
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ssl:verify-certificate yes
          mkdir -p /public_html/EnB/Download
          cd /public_html/EnB/Download
          put "release/EnB Droplist.zip" -o "EnB Droplist.zip"
          put "release/version.json" -o "version.json"
          bye
          LFTP

      - name: Verify uploaded files via FTP
        shell: bash
        env:
          FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
          FTP_PASS: ${{ secrets.SIMPLY_FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" ftp.simply.com <<'LFTP'
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ssl:verify-certificate yes
          cd /public_html/EnB/Download
          cls -l "EnB Droplist.zip"
          cls -l "version.json"
          bye
          LFTP

      - name: Public URL check (informational)
        continue-on-error: true
        shell: bash
        run: |
          curl -A 'Mozilla/5.0' --silent --show-error --location --max-time 20 https://soulbound.se/EnB/Download/version.json || true
