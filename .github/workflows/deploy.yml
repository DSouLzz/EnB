name: Deploy EnB Droplist to soulbound.se

on:
  push:
    branches: [main]
    paths:
      - 'release/EnB Droplist.zip'
      - 'release/version.json'
      - '.github/scripts/build_1140.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enb-droplist-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build EnB Droplist 1.1.40 from verified 1.1.39 release
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/build_1140.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "release/EnB Droplist.zip" release/version.json
          if ! git diff --cached --quiet; then
            git commit -m "Release EnB Droplist 1.1.40 built and verified"
            git push
          else
            echo "Release already at verified 1.1.40; nothing to commit."
          fi

      - name: Verify release manifest matches ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          zp=pathlib.Path('release/EnB Droplist.zip')
          m=json.loads(pathlib.Path('release/version.json').read_text(encoding='utf-8'))
          actual=hashlib.sha256(zp.read_bytes()).hexdigest()
          if m.get('version')!='1.1.40': raise SystemExit('wrong version '+str(m.get('version')))
          if actual!=str(m.get('sha256','')).lower(): raise SystemExit('SHA mismatch')
          if zp.stat().st_size<40000: raise SystemExit('ZIP unexpectedly small')
          with zipfile.ZipFile(zp) as z:
              if z.testzip(): raise SystemExit('ZIP integrity failed')
              tray=next(n for n in z.namelist() if n.endswith('enb_drop_logger_tray.py'))
              source=z.read(tray).decode('utf-8')
              for required in ('readers_agree','title_similarity(map_title, probe_title)','update_zone(chosen_zone)','is_level_only_target_name'):
                  if required not in source: raise SystemExit('missing '+required)
          print('release verification: OK',m['version'],actual,zp.stat().st_size)
          PY

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload release files to Simply.com
        env:
          FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
          FTP_PASS: ${{ secrets.SIMPLY_FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" ftp.simply.com <<'LFTP'
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ssl:verify-certificate yes
          mkdir -p /public_html/EnB/Download
          cd /public_html/EnB/Download
          put "release/EnB Droplist.zip" -o "EnB Droplist.zip"
          put "release/version.json" -o "version.json"
          bye
          LFTP

      - name: Verify uploaded files via FTP
        env:
          FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
          FTP_PASS: ${{ secrets.SIMPLY_FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" ftp.simply.com <<'LFTP'
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ssl:verify-certificate yes
          cd /public_html/EnB/Download
          cls -l "EnB Droplist.zip"
          cls -l "version.json"
          bye
          LFTP

      - name: Public URL check (informational)
        continue-on-error: true
        run: curl -A 'Mozilla/5.0' --silent --show-error --location --max-time 20 https://soulbound.se/EnB/Download/version.json || true
