name: Deploy EnB Droplist to soulbound.se

on:
  push:
    branches: [main]
    paths:
      - 'release/EnB Droplist.zip'
      - 'release/version.json'
      - 'release_parts/1136_*.b64'
      - '.github/scripts/assemble_1136.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enb-droplist-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble exact verified EnB Droplist 1.1.36 ZIP
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/assemble_1136.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "release/EnB Droplist.zip" release/version.json
          if ! git diff --cached --quiet; then
            git commit -m "Release EnB Droplist 1.1.36 exact verified binary"
            git push
          fi

      - name: Verify release manifest matches ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          zp=pathlib.Path('release/EnB Droplist.zip')
          m=json.loads(pathlib.Path('release/version.json').read_text(encoding='utf-8'))
          actual=hashlib.sha256(zp.read_bytes()).hexdigest()
          expected='85449e48b84d2ae1c7e97058965eb7dc2b585ab156e622ccb3c0419f7848b8b5'
          print('version:',m.get('version'));print('size:',zp.stat().st_size);print('sha256:',actual)
          if m.get('version')!='1.1.36':raise SystemExit('wrong version')
          if actual!=expected or str(m.get('sha256','')).lower()!=expected:raise SystemExit('SHA mismatch')
          if zp.stat().st_size!=50111:raise SystemExit(f'wrong ZIP size {zp.stat().st_size}')
          with zipfile.ZipFile(zp) as z:
              bad=z.testzip()
              if bad:raise SystemExit(f'ZIP integrity failed at {bad}')
          print('release verification: OK')
          PY

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload release files to Simply.com
        env:
          FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
          FTP_PASS: ${{ secrets.SIMPLY_FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" ftp.simply.com <<'LFTP'
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ssl:verify-certificate yes
          mkdir -p /public_html/EnB/Download
          cd /public_html/EnB/Download
          put "release/EnB Droplist.zip" -o "EnB Droplist.zip"
          put "release/version.json" -o "version.json"
          bye
          LFTP

      - name: Verify uploaded files via FTP
        env:
          FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
          FTP_PASS: ${{ secrets.SIMPLY_FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" ftp.simply.com <<'LFTP'
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ssl:verify-certificate yes
          cd /public_html/EnB/Download
          cls -l "EnB Droplist.zip"
          cls -l "version.json"
          bye
          LFTP

      - name: Public URL check (informational)
        continue-on-error: true
        run: curl -A 'Mozilla/5.0' --silent --show-error --location --max-time 20 https://soulbound.se/EnB/Download/version.json || true
