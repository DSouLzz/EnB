name: Assemble EnB Droplist 1.1.30

on:
  push:
    branches: [main]
    paths:
      - 'release130/**'
      - '.github/workflows/assemble_130.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enb-droplist-assemble-130
  cancel-in-progress: true

jobs:
  assemble:
    if: github.event.head_commit.message != 'Release EnB Droplist 1.1.30 assembled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble exact ZIP and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cat release130/part00.b64 release130/part01.b64 release130/part02.b64 release130/part03.b64 release130/part04.b64 > /tmp/enb130.b64
          base64 --decode /tmp/enb130.b64 > "release/EnB Droplist.zip"
          echo "934a65fc8f6ddc248237256b5975c1f1635af0945494b90714a33ceae9c7377e  release/EnB Droplist.zip" | sha256sum -c -
          python - <<'PY'
          import json, zipfile
          path = 'release/EnB Droplist.zip'
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'ZIP integrity failed at {bad}')
          d = {
            'name': 'EnB Droplist',
            'version': '1.1.30',
            'download_url': 'https://soulbound.se/EnB/Download/EnB%20Droplist.zip',
            'sha256': '934a65fc8f6ddc248237256b5975c1f1635af0945494b90714a33ceae9c7377e',
            'release_date': '2026-08-23',
            'release_notes': 'Fixes online updater and Check/Repair. Updates now fall back to the GitHub release when soulbound.se fails or has the wrong SHA. Check/Repair is fully automatic and does not ask the user to locate a folder or ZIP.'
          }
          with open('release/version.json', 'w', encoding='utf-8') as f:
              json.dump(d, f, indent=2)
              f.write('\n')
          PY
          test "$(stat -c%s 'release/EnB Droplist.zip')" = "45016"

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "release/EnB Droplist.zip" release/version.json
          git rm -r release130
          git commit -m "Release EnB Droplist 1.1.30 assembled"
          git push
